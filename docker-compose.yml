services:
  postgres:
    image: postgres:16
    container_name: trabajo-final-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trabajo_final
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: